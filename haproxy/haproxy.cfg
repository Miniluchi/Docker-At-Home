# Frontal TCP natif macOS : le port forwarding OrbStack masque l'IP client,
# HAProxy la transmet à Traefik via PROXY protocol v2 (TLS terminé par Traefik).
# Installé via Homebrew, lien : /opt/homebrew/etc/haproxy.cfg -> ce fichier.
global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend web
    bind :::80 v4v6
    default_backend traefik_web

frontend websecure
    bind :::443 v4v6
    default_backend traefik_websecure

backend traefik_web
    server traefik 127.0.0.1:8080 send-proxy-v2

backend traefik_websecure
    server traefik 127.0.0.1:8443 send-proxy-v2
