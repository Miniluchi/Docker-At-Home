---
# Homepage Services Configuration
# Documentation: https://gethomepage.dev/configs/services/

- Demandes:
    - Radarr:
        href: https://radarr.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: radarr.png
        description: Gestionnaire films
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
          fields: ["movies", "wanted", "queued"]
    - Sonarr:
        href: https://sonarr.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: sonarr.png
        description: Gestionnaire series
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
          fields: ["series", "wanted", "queued"]

- Medias:
    - Jellyfin:
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        icon: jellyfin.png
        description: Streaming video
        server: my-docker
        container: jellyfin
    - Seerr:
        href: https://seerr.{{HOMEPAGE_VAR_DOMAIN}}
        icon: jellyseerr.png
        description: Demandes de medias
        server: my-docker
        container: seerr
    - Prowlarr:
        href: https://prowlarr.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: prowlarr.png
        description: Indexeurs
        server: my-docker
        container: prowlarr
    - qui:
        href: https://qui.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: https://raw.githubusercontent.com/autobrr/qui/main/web/public/icon.png
        description: WebUI qBittorrent
        server: my-docker
        container: qui
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{HOMEPAGE_VAR_QBT_USER}}"
          password: "{{HOMEPAGE_VAR_QBT_PASSWORD}}"

- Infrastructure:
    - Arcane:
        href: https://arcane.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: arcane.png
        description: Gestion Docker
        server: my-docker
        container: arcane
    - WUD:
        href: https://wud.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: whats-up-docker.png
        description: Mises à jour des images
        server: my-docker
        container: wud
        widget:
          type: whatsupdocker
          url: http://wud:3000
          username: homepage
          password: "{{HOMEPAGE_VAR_WUD_PASSWORD}}"
    - Pocket ID:
        href: https://id.{{HOMEPAGE_VAR_DOMAIN}}
        icon: pocket-id.png
        description: SSO / Identity Provider
        server: my-docker
        container: pocket-id
    - Glances:
        href: https://glances.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: glances.png
        description: Monitoring systeme
    - CrowdSec:
        href: https://app.crowdsec.net/
        icon: crowdsec.png
        description: IPS collaboratif
        server: my-docker
        container: crowdsec
        widget:
          type: crowdsec
          url: http://crowdsec:8080
          username: "{{HOMEPAGE_VAR_CROWDSEC_USERNAME}}"
          password: "{{HOMEPAGE_VAR_CROWDSEC_PASSWORD}}"

- Outils:
    - SonarQube:
        href: https://sonarqube.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: sonarqube.png
        description: Analyse de code
        server: my-docker
        container: sonarqube
    - OpenClaw:
        href: https://openclaw.{{HOMEPAGE_VAR_PRIVATE_DOMAIN}}
        icon: openclaw.png
        description: Assistant IA
        server: my-docker
        container: openclaw
    - Stirling PDF:
        href: https://pdf.{{HOMEPAGE_VAR_DOMAIN}}
        icon: stirling-pdf.png
        description: Outils PDF
        server: my-docker
        container: stirling-pdf

- Metriques:
    - CPU:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: cpu
          chart: true
          refreshInterval: 3000
          pointsLimit: 30
    - Memory:
        widget:
          type: glances
          url: http://host.docker.internal:61208
          version: 4
          metric: memory
          chart: true
          refreshInterval: 3000
          pointsLimit: 30
