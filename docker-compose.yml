# Docker Compose with profiles
# Available profiles:
# - infrastructure : Core services (Traefik, Portainer, WUD, Authentik, Homepage, Glances, CrowdSec)
# - dashboard      : Dashboards (Homepage)
# - media          : Media (Jellyfin, Jellyseerr, Radarr, Sonarr, Prowlarr, qBittorrent + Gluetun, qui, Jellystat)
# - devtools       : Developer tools (SonarQube, Authentik)
# - security       : Security (CrowdSec + Traefik bouncer)
# - tools          : Tools (FreshRSS)
# - all            : All services
#
# The PostgreSQL databases (Authentik, Jellystat, SonarQube) start with their
# parent service and have no dedicated profile.
#
# Usage:
# - Start a profile: docker compose --profile media up -d
# - Start several profiles: docker compose --profile media --profile tools up -d
# - Start everything: docker compose --profile all up -d
# - Stop a profile: docker compose --profile media down

services:
  # Traefik - Reverse Proxy
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      - TZ=${TZ}
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
      - DOMAIN_BASE=${DOMAIN_BASE}
      # ACME DNS-01 via OVH (lego) — permet le wildcard *.lan.${DOMAIN_BASE} et
      # supprime la dépendance au challenge HTTP sur :80
      - OVH_ENDPOINT=${OVH_ENDPOINT}
      - OVH_APPLICATION_KEY=${OVH_APPLICATION_KEY}
      - OVH_APPLICATION_SECRET=${OVH_APPLICATION_SECRET}
      - OVH_CONSUMER_KEY=${OVH_CONSUMER_KEY}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--log.level=INFO"
      - "--ping=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsEncrypt.acme.dnsChallenge.provider=ovh"
      - "--certificatesresolvers.letsEncrypt.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsEncrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsEncrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # TLS par défaut pour tous les routeurs websecure (wildcards apex + *.lan).
      # Ne PAS mettre de label tls* sur un routeur : même tls=true remplace ce bloc.
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsEncrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=${DOMAIN_BASE}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN_BASE}"
      - "--entrypoints.websecure.http.tls.domains[1].main=lan.${DOMAIN_BASE}"
      - "--entrypoints.websecure.http.tls.domains[1].sans=*.lan.${DOMAIN_BASE}"
      # Logs pour CrowdSec
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      # Plugin CrowdSec Bouncer
      - "--experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.bouncer.version=v1.6.0"
      # Fichier de configuration dynamique (middleware plugin)
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - "host.docker.internal:host-gateway" # A TESTER
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik_letsencrypt:/letsencrypt
      - traefik_config:/etc/traefik
      - traefik_logs:/var/log/traefik
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - traefik_net
    labels:
      - "wud.trigger.exclude=docker.update"
    profiles:
      - infrastructure
      - all

  # Tailscale - nœud tailnet "dah-proxy" (accès privé aux services *.lan.${DOMAIN_BASE})
  # Sidecar dans le netns de Traefik : l'IP tailnet 100.x du nœud expose directement
  # Traefik :443 aux devices du tailnet (routage host-based inchangé).
  # TS_USERSPACE=false requis : le mode userspace (défaut) ne délivre pas le trafic
  # entrant sans `tailscale serve` — le kernel networking (tun) le fait nativement.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    network_mode: "service:traefik"
    depends_on:
      traefik:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=dah-proxy
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # Ne pas se ré-authentifier à chaque restart (l'état persiste dans le volume)
      - TS_AUTH_ONCE=true
      # Ne PAS accepter le DNS MagicDNS : le netns est partagé avec Traefik,
      # qui doit continuer de résoudre les noms de conteneurs via le DNS Docker.
      - TS_ACCEPT_DNS=false
      # Healthcheck natif (v1.78+) : /healthz répond 200 si le nœud a une IP tailnet
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:9002/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - dah_proxy_state:/var/lib/tailscale
    labels:
      - "wud.trigger.exclude=docker.update"
    profiles:
      - infrastructure
      - all

  # Homarr - Dashboard
  # Portainer - Container Management
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: "on-failure:2"
    mem_limit: 128m
    memswap_limit: 128m
    networks:
      - traefik_net
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=traefik_net"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    depends_on:
      traefik:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    profiles:
      - infrastructure
      - all

  # WUD (What's Up Docker) - Suivi des mises à jour d'images (https://github.com/getwud/wud)
  wud:
    image: ghcr.io/getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # WUD_AUTH_OIDC_AUTHENTIK_DISCOVERY / _CLIENTID / _CLIENTSECRET / _ADMINGROUP fournis par Terraform
    # (cf. terraform/authentik/generated/wud.env)
    env_file:
      - ./terraform/authentik/generated/wud.env
    environment:
      - TZ=${TZ}
      - WUD_PUBLIC_URL=https://wud.lan.${DOMAIN_BASE}
      - WUD_AUTH_OIDC_AUTHENTIK_REDIRECT=true
      - WUD_AUTH_OIDC_AUTHENTIK_DEFAULTROLE=none
      # Pas de scope "groups" chez Authentik : le claim groups vient du scope profile
      - WUD_AUTH_OIDC_AUTHENTIK_SCOPE=openid email profile
      # 1 scan/jour (rate limit Docker Hub), conteneurs arrêtés inclus, digest pour les tags mutables
      - WUD_WATCHER_LOCAL_CRON=0 6 * * *
      - WUD_WATCHER_LOCAL_WATCHALL=true
      - WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT=true
      # Image publiée depuis au moins 1 jour avant d'être proposée
      - WUD_WATCHER_LOCAL_DELAY=1d
      # MAJ automatique, sauf conteneurs labellisés wud.trigger.exclude=docker.update ;
      # pas de prune : l'ancienne image reste disponible pour un rollback
      - WUD_TRIGGER_DOCKER_UPDATE_AUTO=true
      # ONCE=true (défaut) ne déclenche que si le résultat change : incompatible avec DELAY
      # (MAJ détectée pendant le délai, jamais redéclenchée ensuite)
      - WUD_TRIGGER_DOCKER_UPDATE_ONCE=false
    volumes:
      # rw requis par le trigger docker (recréation des conteneurs)
      - /var/run/docker.sock:/var/run/docker.sock
      - wud_store:/store
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`wud.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.wud.entrypoints=websecure"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet), OIDC géré par WUD
      - "wud.trigger.exclude=docker.update"
    profiles:
      - infrastructure
      - all

  # Seerr - Demandes de médias pour Jellyfin
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - seerr_config:/app/config
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN_BASE}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=traefik_net"
      # CrowdSec only (OIDC géré directement par Seerr)
      - "traefik.http.routers.seerr.middlewares=crowdsec-bouncer@file"
    profiles:
      - media
      - all

  # Jellyfin tourne nativement (transcodage matériel) ; routage dans traefik-dynamic.yml.

  # Radarr - Films
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__AUTH__METHOD=External
    volumes:
      - radarr_config:/config
      - ${MEDIA_PATH}:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Authentik conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.radarr.middlewares=authentik-radarr@docker"
      - "traefik.http.middlewares.authentik-radarr.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-radarr.forwardauth.trustForwardHeader=true"
      # API hors Authentik (auth par clé X-Api-Key) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.radarr-api.rule=Host(`radarr.lan.${DOMAIN_BASE}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.radarr-api.entrypoints=websecure"
      - "traefik.http.routers.radarr-api.service=radarr"
      - "traefik.http.routers.radarr-api.priority=100"
    profiles:
      - media
      - all

  # Sonarr - Séries TV
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__AUTH__METHOD=External
    volumes:
      - sonarr_config:/config
      - ${MEDIA_PATH}:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Authentik conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.sonarr.middlewares=authentik-sonarr@docker"
      - "traefik.http.middlewares.authentik-sonarr.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-sonarr.forwardauth.trustForwardHeader=true"
      # API hors Authentik (auth par clé X-Api-Key) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.sonarr-api.rule=Host(`sonarr.lan.${DOMAIN_BASE}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sonarr-api.entrypoints=websecure"
      - "traefik.http.routers.sonarr-api.service=sonarr"
      - "traefik.http.routers.sonarr-api.priority=100"
    profiles:
      - media
      - all

  # Gluetun - VPN Gateway (ProtonVPN WireGuard)
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      # WireGuard avec une clé dédiée à gluetun (NAT-PMP coché) : une clé partagée fait tourner le port, cf. gluetun#3196
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_PRIVATE_KEY}
      # Retour à OpenVPN : VPN_TYPE=openvpn + décommenter
      # - OPENVPN_USER=${PROTON_OPENVPN_USER}
      # - OPENVPN_PASSWORD=${PROTON_OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Netherlands
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Sync du port forwardé délégué à gluetun-qbt-watchdog (remplace l'ancien VPN_PORT_FORWARDING_UP_COMMAND)
      # Control server : routes privées par défaut depuis gluetun v3.40 → auth par clé API pour le watchdog
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}'
    networks:
      - traefik_net
    # Pas de route Traefik : WebUI servie par qui (qui.lan), accès interne via gluetun:8080
    labels:
      - "wud.trigger.exclude=docker.update"
    profiles:
      - media
      - all

  # qBittorrent - Client Torrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - ${MEDIA_PATH}:/data
      - ./qbittorrent-dracula:/dracula-webui:ro
    profiles:
      - media
      - all

  # Watchdog: sync du port forwardé Gluetun → qBittorrent + redémarrage qBittorrent au besoin
  # https://github.com/brunoorsolon/gluetun-qbt-watchdog
  gluetun-qbt-watchdog:
    image: ghcr.io/brunoorsolon/gluetun-qbt-watchdog:latest
    container_name: gluetun-qbt-watchdog
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    # Pas de healthcheck natif : en mode password le script réécrit /tmp/qbt_login_response.txt
    # à chaque cycle (30s) → on en vérifie la fraîcheur (< 5 min) pour détecter une boucle figée.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test $(( $(date +%s) - $(stat -c %Y /tmp/qbt_login_response.txt 2>/dev/null || echo 0) )) -lt 300",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - gluetun
      - qbittorrent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - GLUETUN_CONTAINER_NAME=gluetun
      - GLUETUN_API=http://gluetun:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - QBT_CONTAINER_NAME=qbittorrent
      # qBittorrent tourne dans le netns de gluetun → joignable via gluetun:8080
      - QBT_API=http://gluetun:8080
      - QBT_AUTH_MODE=password
      - QBT_USER=${QBT_USER}
      - QBT_PASS=${QBT_PASS}
      - CHECK_INTERVAL=60
    networks:
      - traefik_net
    profiles:
      - media
      - all

  # qui - WebUI qBittorrent (https://github.com/autobrr/qui)
  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      authentik-server:
        condition: service_healthy
      gluetun:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:7476/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # QUI__OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET fournis par Terraform
    # (cf. terraform/authentik/generated/qui.env)
    env_file:
      - ./terraform/authentik/generated/qui.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - QUI__HOST=0.0.0.0
      - QUI__PORT=7476
      - QUI__OIDC_ENABLED=true
      - QUI__OIDC_REDIRECT_URL=https://qui.lan.${DOMAIN_BASE}/api/auth/oidc/callback
      - QUI__OIDC_DISABLE_BUILT_IN_LOGIN=true
    volumes:
      - qui_config:/config
      # Mêmes chemins que qBittorrent (orphan scan, hardlinks, automations)
      - ${MEDIA_PATH}:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qui.rule=Host(`qui.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.qui.entrypoints=websecure"
      - "traefik.http.services.qui.loadbalancer.server.port=7476"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet), OIDC géré par qui ; /proxy/<clé> authentifié par clé client
    profiles:
      - media
      - all

  # Prowlarr - Indexer Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: "on-failure:2"
    mem_limit: 384m
    memswap_limit: 384m
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PROWLARR__AUTH__METHOD=External
    volumes:
      - prowlarr_config:/config
    networks:
      - traefik_net
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Authentik conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.prowlarr.middlewares=authentik-prowlarr@docker"
      - "traefik.http.middlewares.authentik-prowlarr.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-prowlarr.forwardauth.trustForwardHeader=true"
      # API hors Authentik (auth par clé X-Api-Key) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.prowlarr-api.rule=Host(`prowlarr.lan.${DOMAIN_BASE}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.prowlarr-api.entrypoints=websecure"
      - "traefik.http.routers.prowlarr-api.service=prowlarr"
      - "traefik.http.routers.prowlarr-api.priority=100"
    profiles:
      - media
      - all

  # Jellystat - Statistiques Jellyfin
  jellystat-db:
    image: postgres:16-alpine
    container_name: jellystat-db
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER:-jellystat}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD:?jellystat database password required}
      POSTGRES_DB: ${JELLYSTAT_POSTGRES_DB:-jellystat}
      TZ: ${TZ}
    volumes:
      - jellystat_postgres_data:/var/lib/postgresql/data
    networks:
      - traefik_net
    labels:
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^16-alpine$$'
      - "wud.watch.digest=true"
    profiles:
      - media
      - all

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${JELLYSTAT_POSTGRES_USER:-jellystat}
      - POSTGRES_PASSWORD=${JELLYSTAT_POSTGRES_PASSWORD:?jellystat database password required}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - JWT_SECRET=${JELLYSTAT_JWT_SECRET:?jellystat JWT secret required}
    volumes:
      - jellystat_backup_data:/app/backend/backup-data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellystat.rule=Host(`jellystat.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.jellystat.entrypoints=websecure"
      - "traefik.http.services.jellystat.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Authentik conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.jellystat.middlewares=authentik-jellystat@docker"
      - "traefik.http.middlewares.authentik-jellystat.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-jellystat.forwardauth.trustForwardHeader=true"
      # API + proxy hors Authentik (auth par clé x-api-token Jellystat) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.jellystat-api.rule=Host(`jellystat.lan.${DOMAIN_BASE}`) && (PathPrefix(`/api`) || PathPrefix(`/proxy`))"
      - "traefik.http.routers.jellystat-api.entrypoints=websecure"
      - "traefik.http.routers.jellystat-api.service=jellystat"
      - "traefik.http.routers.jellystat-api.priority=100"
    profiles:
      - media
      - all

  # FreshRSS - RSS Feed Reader
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f apache2 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET fournis par Terraform
    # (cf. terraform/authentik/generated/freshrss.env)
    env_file:
      - ./terraform/authentik/generated/freshrss.env
    environment:
      - TZ=${TZ}
      - CRON_MIN=1,31
      # OIDC Configuration avec Authentik
      - OIDC_ENABLED=1
      - OIDC_PROVIDER_METADATA_URL=https://auth.${DOMAIN_BASE}/application/o/freshrss/.well-known/openid-configuration
      - OIDC_X_FORWARDED_HEADERS=X-Forwarded-Proto X-Forwarded-Host
      - OIDC_SCOPES=openid email profile
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`rss.${DOMAIN_BASE}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_net"
      # Public : CrowdSec (OIDC géré directement par FreshRSS)
      - "traefik.http.routers.freshrss.middlewares=crowdsec-bouncer@file"
    profiles:
      - tools
      - all

  # iSponsorBlockTV
  isponsorblocktv:
    image: ghcr.io/dmunozv04/isponsorblocktv:v2
    container_name: isponsorblocktv
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      - TZ=${TZ}
    volumes:
      - ./isponsorblocktv:/app/data
    networks:
      - traefik_net
    labels:
      - 'wud.tag.include=^v2$$'
      - "wud.watch.digest=true"
    profiles:
      - media
      - all

  # PostgreSQL Authentik - Base de données dédiée
  authentik-db:
    image: postgres:16-alpine
    container_name: authentik-db
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?authentik database password required}
      POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
      TZ: ${TZ}
    volumes:
      - postgres_authentik_data:/var/lib/postgresql/data
    networks:
      - traefik_net
    labels:
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^16-alpine$$'
      - "wud.watch.digest=true"
    profiles:
      - infrastructure
      - devtools
      - all

  # Authentik Server - SSO/Identity Provider
  authentik-server:
    # Pas de piste LTS chez authentik : ni tag `lts` au registry (seuls `latest`,
    # `stable` et les versions), ni release longue durée. Cycle ~3 mois, seules la
    # version courante et la précédente reçoivent les correctifs de sécurité
    # (2026.8 et 2026.5 à ce jour) — rester sur la dernière est la position la plus
    # supportée. Le worker doit garder exactement le même tag que le serveur.
    # NB : authentik ne supporte pas le downgrade de base (migrations non réversibles).
    image: ghcr.io/goauthentik/server:2026.8.2
    container_name: authentik-server
    restart: unless-stopped
    command: server
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      authentik-db:
        condition: service_healthy
    networks:
      - traefik_net
    healthcheck:
      # curl a été retiré de l'image authentik : on utilise le binaire ak intégré
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?authentik secret key required}
      TZ: ${TZ}
    volumes:
      - authentik_media:/media
      - authentik_custom_templates:/templates
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN_BASE}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      - "traefik.docker.network=traefik_net"
      # CrowdSec protection
      - "traefik.http.routers.authentik.middlewares=crowdsec-bouncer@file"
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^\d{4}\.\d+\.\d+$$'
    profiles:
      - infrastructure
      - devtools
      - all

  # Authentik Worker - Exécute les tâches de fond (blueprints, outposts, mails,
  # rotation de certificats). Sans lui la file de tâches Postgres n'est jamais
  # consommée : les blueprints par défaut (setup MFA TOTP/WebAuthn) ne s'appliquent pas.
  authentik-worker:
    # Même tag que authentik-server (cf. note plus haut) : les deux doivent être alignés.
    image: ghcr.io/goauthentik/server:2026.8.2
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      authentik-db:
        condition: service_healthy
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?authentik secret key required}
      TZ: ${TZ}
    volumes:
      - authentik_media:/media
      - authentik_custom_templates:/templates
    labels:
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^\d{4}\.\d+\.\d+$$'
    profiles:
      - infrastructure
      - devtools
      - all

  # Homepage - Dashboard léger
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      authentik-server:
        condition: service_healthy
    networks:
      - traefik_net
    extra_hosts:
      # Widget Glances : Glances tourne nativement sur l'hôte (port 61208)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./homepage-settings/services.yaml:/app/config/services.yaml
      - ./homepage-settings/settings.yaml:/app/config/settings.yaml
      - ./homepage-settings/widgets.yaml:/app/config/widgets.yaml
      - ./homepage-settings/docker.yaml:/app/config/docker.yaml
      - homepage_config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_PATH}:/mnt/media:ro
    # HOMEPAGE_OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET fournis par Terraform
    # (cf. terraform/authentik/generated/homepage.env)
    env_file:
      - ./terraform/authentik/generated/homepage.env
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=lan.${DOMAIN_BASE}
      # Domaine public (liens jellyfin/seerr/auth) et zone privée tailnet (le reste)
      - HOMEPAGE_VAR_DOMAIN=${DOMAIN_BASE}
      - HOMEPAGE_VAR_PRIVATE_DOMAIN=lan.${DOMAIN_BASE}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      # Widget CrowdSec : machine LAPI dédiée (cscli machines add homepage)
      - HOMEPAGE_VAR_CROWDSEC_USERNAME=${CROWDSEC_HOMEPAGE_USERNAME}
      - HOMEPAGE_VAR_CROWDSEC_PASSWORD=${CROWDSEC_HOMEPAGE_PASSWORD}
      # Widget qui : qBittorrent interrogé directement (netns gluetun)
      - HOMEPAGE_VAR_QBT_USER=${QBT_USER}
      - HOMEPAGE_VAR_QBT_PASSWORD=${QBT_PASS}
      # Widget WUD : compte local read-only "homepage" (l'API refuse l'anonyme)
      - HOMEPAGE_VAR_WUD_PASSWORD=${WUD_HOMEPAGE_PASSWORD:?wud homepage password required}
      # Auth native OIDC (Homepage >= 2.0) : remplace le forward auth Traefik.
      # AUTO_LOGIN garde la redirection transparente vers Authentik qu'offrait le proxy.
      - HOMEPAGE_AUTH_ENABLED=true
      - HOMEPAGE_AUTH_SECRET=${HOMEPAGE_AUTH_SECRET:?homepage auth secret required}
      - HOMEPAGE_EXTERNAL_URL=https://lan.${DOMAIN_BASE}
      - HOMEPAGE_OIDC_NAME=Authentik
      - HOMEPAGE_OIDC_AUTO_LOGIN=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : pas de forward auth ici, Homepage porte son propre OIDC
      # (les callbacks /api/auth/* doivent atteindre Homepage sans interception).
    profiles:
      - dashboard
      - infrastructure
      - all

  # SonarQube - Analyse de code
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: on-failure
    mem_limit: 2560m
    memswap_limit: 2560m
    depends_on:
      sonarqube-db:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      # L'image sonarqube:community n'embarque pas wget, seulement curl
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9000/api/system/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_POSTGRES_DB:-sonarqube}
      - SONAR_JDBC_USERNAME=${SONARQUBE_POSTGRES_USER:-sonarqube}
      - SONAR_JDBC_PASSWORD=${SONARQUBE_POSTGRES_PASSWORD:?sonarqube database password required}
      # Limites mémoire JVM (Xms doit être égal à Xmx pour Elasticsearch)
      - SONAR_WEB_JAVAOPTS=-Xmx512m -Xms512m
      - SONAR_CE_JAVAOPTS=-Xmx512m -Xms512m
      - SONAR_SEARCH_JAVAOPTS=-Xmx512m -Xms512m
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.${DOMAIN_BASE}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
      - "traefik.docker.network=traefik_net"
      # Public : CrowdSec (SSO SAML géré directement par SonarQube)
      - "traefik.http.routers.sonarqube.middlewares=crowdsec-bouncer@file"
      # SSO Authentik forcé : la page de login redirige vers SAML, le login local est bloqué
      - "traefik.http.routers.sonarqube-login.rule=Host(`sonarqube.${DOMAIN_BASE}`) && Path(`/sessions/new`)"
      - "traefik.http.routers.sonarqube-login.entrypoints=websecure"
      - "traefik.http.routers.sonarqube-login.service=sonarqube"
      - "traefik.http.routers.sonarqube-login.priority=100"
      - "traefik.http.routers.sonarqube-login.middlewares=crowdsec-bouncer@file,sonarqube-saml-redirect@docker"
      - "traefik.http.middlewares.sonarqube-saml-redirect.redirectregex.regex=^https://([^/]+)/sessions/new(.*)"
      - "traefik.http.middlewares.sonarqube-saml-redirect.redirectregex.replacement=https://$${1}/sessions/init/saml$${2}"
      - "traefik.http.routers.sonarqube-local-auth.rule=Host(`sonarqube.${DOMAIN_BASE}`) && Path(`/api/authentication/login`)"
      - "traefik.http.routers.sonarqube-local-auth.entrypoints=websecure"
      - "traefik.http.routers.sonarqube-local-auth.service=sonarqube"
      - "traefik.http.routers.sonarqube-local-auth.priority=100"
      - "traefik.http.routers.sonarqube-local-auth.middlewares=sonarqube-deny@docker"
      - "traefik.http.middlewares.sonarqube-deny.ipallowlist.sourcerange=127.0.0.1/32"
    profiles:
      - devtools
      - all

  # SonarQube PostgreSQL Database
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SONARQUBE_POSTGRES_USER:-sonarqube} -d ${SONARQUBE_POSTGRES_DB:-sonarqube}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - POSTGRES_USER=${SONARQUBE_POSTGRES_USER:-sonarqube}
      - POSTGRES_PASSWORD=${SONARQUBE_POSTGRES_PASSWORD:?sonarqube database password required}
      - POSTGRES_DB=${SONARQUBE_POSTGRES_DB:-sonarqube}
      - TZ=${TZ}
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - traefik_net
    labels:
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^16-alpine$$'
      - "wud.watch.digest=true"
    profiles:
      - devtools
      - all

  # CrowdSec - Security Engine (IPS collaboratif)
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/linux crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      - GID=${PGID}
      # Enroll key pour la console CrowdSec
      - ENROLL_KEY=${CROWDSEC_ENROLL_KEY}
      - ENROLL_INSTANCE_NAME=${HOSTNAME:-docker-server}
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      # Configuration d'acquisition personnalisée
      - ./crowdsec-acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Logs Traefik à analyser
      - traefik_logs:/var/log/traefik:ro
      # Logs SSH (host)
      - /var/log/auth.log:/var/log/auth.log:ro
      # Docker socket pour lire les logs des conteneurs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"
      - "wud.trigger.exclude=docker.update"
    networks:
      - traefik_net
    profiles:
      - security
      - infrastructure
      - all

networks:
  traefik_net:
    name: traefik_net
    external: true

volumes:
  # Traefik
  traefik_letsencrypt:
  traefik_config:
  traefik_logs:

  # Tailscale (état du nœud dah-proxy — doit persister pour garder l'identité)
  dah_proxy_state:

  # Homepage
  homepage_config:

  # Portainer
  portainer_data:

  # WUD
  wud_store:

  # Seerr
  seerr_config:

  # Radarr
  radarr_config:

  # Sonarr
  sonarr_config:

  # qBittorrent
  qbittorrent_config:

  # qui
  qui_config:

  # Prowlarr
  prowlarr_config:

  # Authentik
  postgres_authentik_data:
  authentik_media:
  authentik_custom_templates:

  # SonarQube
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgres_data:

  # CrowdSec
  crowdsec_config:
  crowdsec_data:

  # FreshRSS
  freshrss_data:
  freshrss_extensions:

  # Jellystat
  jellystat_postgres_data:
  jellystat_backup_data:
