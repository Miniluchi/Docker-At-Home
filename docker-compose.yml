# Docker Compose with profiles
# Available profiles:
# - infrastructure : Core services (Traefik, Arcane, WUD, Pocket ID, Tinyauth, Homepage, Glances, CrowdSec)
# - dashboard      : Dashboards (Homepage)
# - media          : Media (Jellyfin, Jellyseerr, Radarr, Sonarr, Prowlarr, qBittorrent + Gluetun, qui, Tracearr)
# - devtools       : Developer tools (SonarQube, Pocket ID, Tinyauth)
# - security       : Security (CrowdSec + Traefik bouncer)
# - tools          : Tools (FreshRSS)
# - ai             : AI assistant (OpenClaw)
# - all            : All services
#
# The databases (Tracearr, SonarQube) start with their
# parent service and have no dedicated profile.
#
# Usage:
# - Start a profile: docker compose --profile media up -d
# - Start several profiles: docker compose --profile media --profile tools up -d
# - Start everything: docker compose --profile all up -d
# - Stop a profile: docker compose --profile media down

services:
  # Traefik - Reverse Proxy
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      - TZ=${TZ}
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
      - DOMAIN_BASE=${DOMAIN_BASE}
      # ACME DNS-01 via OVH (lego) — permet le wildcard *.lan.${DOMAIN_BASE} et
      # supprime la dépendance au challenge HTTP sur :80
      - OVH_ENDPOINT=${OVH_ENDPOINT}
      - OVH_APPLICATION_KEY=${OVH_APPLICATION_KEY}
      - OVH_APPLICATION_SECRET=${OVH_APPLICATION_SECRET}
      - OVH_CONSUMER_KEY=${OVH_CONSUMER_KEY}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--log.level=INFO"
      - "--ping=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # IP client réelle transmise par HAProxy natif (haproxy/haproxy.cfg) via la passerelle traefik_net
      - "--entrypoints.web.proxyProtocol.trustedIPs=192.168.97.1/32"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=192.168.97.1/32"
      - "--certificatesresolvers.letsEncrypt.acme.dnsChallenge.provider=ovh"
      - "--certificatesresolvers.letsEncrypt.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsEncrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsEncrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # TLS par défaut pour tous les routeurs websecure (wildcards apex + *.lan).
      # Ne PAS mettre de label tls* sur un routeur : même tls=true remplace ce bloc.
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=letsEncrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=${DOMAIN_BASE}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN_BASE}"
      - "--entrypoints.websecure.http.tls.domains[1].main=lan.${DOMAIN_BASE}"
      - "--entrypoints.websecure.http.tls.domains[1].sans=*.lan.${DOMAIN_BASE}"
      # Logs pour CrowdSec
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
      # Plugin CrowdSec Bouncer
      - "--experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.bouncer.version=v1.6.0"
      # Fichier de configuration dynamique (middleware plugin)
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
    ports:
      - 127.0.0.1:8080:80
      - 127.0.0.1:8443:443
    extra_hosts:
      - "host.docker.internal:host-gateway" # A TESTER
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik_letsencrypt:/letsencrypt
      - traefik_config:/etc/traefik
      - traefik_logs:/var/log/traefik
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      # gw_priority : la passerelle de traefik_net doit rester celle des ports publiés (trustedIPs HAProxy)
      traefik_net:
        gw_priority: 1
      openclaw_net:
    labels:
      - "wud.trigger.exclude=docker.update"
    profiles:
      - infrastructure
      - all

  # Tailscale - nœud tailnet "dah-proxy" (accès privé aux services *.lan.${DOMAIN_BASE})
  # Sidecar dans le netns de Traefik : l'IP tailnet 100.x du nœud expose directement
  # Traefik :443 aux devices du tailnet (routage host-based inchangé).
  # TS_USERSPACE=false requis : le mode userspace (défaut) ne délivre pas le trafic
  # entrant sans `tailscale serve` — le kernel networking (tun) le fait nativement.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    network_mode: "service:traefik"
    depends_on:
      traefik:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=dah-proxy
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # Ne pas se ré-authentifier à chaque restart (l'état persiste dans le volume)
      - TS_AUTH_ONCE=true
      # Ne PAS accepter le DNS MagicDNS : le netns est partagé avec Traefik,
      # qui doit continuer de résoudre les noms de conteneurs via le DNS Docker.
      - TS_ACCEPT_DNS=false
      # Healthcheck natif (v1.78+) : /healthz répond 200 si le nœud a une IP tailnet
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:9002/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - dah_proxy_state:/var/lib/tailscale
    labels:
      - "wud.trigger.exclude=docker.update"
    profiles:
      - infrastructure
      - all

  # Arcane - Gestion Docker (https://getarcane.app)
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    # OIDC_CLIENT_ID / _CLIENT_SECRET / _ISSUER_URL / _ROLE_MAPPINGS fournis par Terraform
    # (cf. terraform/pocketid/generated/arcane.env)
    env_file:
      - ./terraform/pocketid/generated/arcane.env
    environment:
      - TZ=${TZ}
      - APP_URL=https://arcane.lan.${DOMAIN_BASE}
      - ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY}
      - OIDC_ENABLED=true
      - OIDC_SCOPES=openid email profile groups
      - OIDC_GROUPS_CLAIM=groups
      - OIDC_PROVIDER_NAME=Pocket ID
      - OIDC_AUTO_REDIRECT_TO_PROVIDER=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552"
      - "traefik.docker.network=traefik_net"
      - "wud.trigger.exclude=docker.update"
    security_opt:
      - no-new-privileges:true
    depends_on:
      traefik:
        condition: service_healthy
      pocket-id:
        condition: service_healthy
    profiles:
      - infrastructure
      - all

  # WUD (What's Up Docker) - Suivi des mises à jour d'images (https://github.com/getwud/wud)
  wud:
    image: ghcr.io/getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      pocket-id:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # WUD_AUTH_OIDC_AUTHENTIK_DISCOVERY / _CLIENTID / _CLIENTSECRET / _ADMINGROUP fournis par Terraform
    # (cf. terraform/pocketid/generated/wud.env)
    env_file:
      - ./terraform/pocketid/generated/wud.env
    environment:
      - TZ=${TZ}
      - WUD_PUBLIC_URL=https://wud.lan.${DOMAIN_BASE}
      - WUD_AUTH_OIDC_AUTHENTIK_REDIRECT=true
      - WUD_AUTH_OIDC_AUTHENTIK_DEFAULTROLE=none
      # Préfixe AUTHENTIK conservé (callback /auth/oidc/authentik/cb) ; le provider est Pocket ID
      - WUD_AUTH_OIDC_AUTHENTIK_SCOPE=openid email profile groups
      # 1 scan/jour (rate limit Docker Hub), conteneurs arrêtés inclus, digest pour les tags mutables
      - WUD_WATCHER_LOCAL_CRON=0 6 * * *
      - WUD_WATCHER_LOCAL_WATCHALL=true
      - WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT=true
      # Image publiée depuis au moins 1 jour avant d'être proposée
      - WUD_WATCHER_LOCAL_DELAY=1d
      # MAJ automatique, sauf conteneurs labellisés wud.trigger.exclude=docker.update ;
      # pas de prune : l'ancienne image reste disponible pour un rollback
      - WUD_TRIGGER_DOCKER_UPDATE_AUTO=true
      # ONCE=true (défaut) ne déclenche que si le résultat change : incompatible avec DELAY
      # (MAJ détectée pendant le délai, jamais redéclenchée ensuite)
      - WUD_TRIGGER_DOCKER_UPDATE_ONCE=false
    volumes:
      # rw requis par le trigger docker (recréation des conteneurs)
      - /var/run/docker.sock:/var/run/docker.sock
      - wud_store:/store
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`wud.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.wud.entrypoints=websecure"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet), OIDC géré par WUD
      - "wud.trigger.exclude=docker.update"
    profiles:
      - infrastructure
      - all

  # Seerr - Demandes de médias pour Jellyfin
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - seerr_config:/app/config
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN_BASE}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=traefik_net"
      # CrowdSec only (OIDC géré directement par Seerr)
      - "traefik.http.routers.seerr.middlewares=crowdsec-bouncer@file"
    profiles:
      - media
      - all

  # Jellyfin tourne nativement (transcodage matériel) ; routage dans traefik-dynamic.yml.

  # Radarr - Films
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      tinyauth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__AUTH__METHOD=External
    volumes:
      - radarr_config:/config
      - ${MEDIA_PATH}:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Tinyauth conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.radarr.middlewares=tinyauth@docker"
      # API hors Tinyauth (auth par clé X-Api-Key) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.radarr-api.rule=Host(`radarr.lan.${DOMAIN_BASE}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.radarr-api.entrypoints=websecure"
      - "traefik.http.routers.radarr-api.service=radarr"
      - "traefik.http.routers.radarr-api.priority=100"
    profiles:
      - media
      - all

  # Sonarr - Séries TV
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      tinyauth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__AUTH__METHOD=External
    volumes:
      - sonarr_config:/config
      - ${MEDIA_PATH}:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Tinyauth conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.sonarr.middlewares=tinyauth@docker"
      # API hors Tinyauth (auth par clé X-Api-Key) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.sonarr-api.rule=Host(`sonarr.lan.${DOMAIN_BASE}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sonarr-api.entrypoints=websecure"
      - "traefik.http.routers.sonarr-api.service=sonarr"
      - "traefik.http.routers.sonarr-api.priority=100"
    profiles:
      - media
      - all

  # Gluetun - VPN Gateway (ProtonVPN WireGuard)
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      # WireGuard avec une clé dédiée à gluetun (NAT-PMP coché) : une clé partagée fait tourner le port, cf. gluetun#3196
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_PRIVATE_KEY}
      # Retour à OpenVPN : VPN_TYPE=openvpn + décommenter
      # - OPENVPN_USER=${PROTON_OPENVPN_USER}
      # - OPENVPN_PASSWORD=${PROTON_OPENVPN_PASSWORD}
      # Netherlands retiré le 2026-10-05 : pool port-forwarding NL en panne côté ProtonVPN
      # (boucle de restart infinie, healthcheck DNS/TLS en échec sur 6 serveurs différents,
      # confirmé non lié à notre config MTU/WireGuard — Switzerland stable immédiatement)
      - SERVER_COUNTRIES=Switzerland
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Sync du port forwardé délégué à gluetun-qbt-watchdog (remplace l'ancien VPN_PORT_FORWARDING_UP_COMMAND)
      # Control server : routes privées par défaut depuis gluetun v3.40 → auth par clé API pour le watchdog
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY}"}'
    networks:
      - traefik_net
    # Pas de route Traefik : WebUI servie par qui (qui.lan), accès interne via gluetun:8080
    labels:
      - "wud.trigger.exclude=docker.update"
    profiles:
      - media
      - all

  # qBittorrent - Client Torrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - ${MEDIA_PATH}:/data
    profiles:
      - media
      - all

  # Watchdog: sync du port forwardé Gluetun → qBittorrent + redémarrage qBittorrent au besoin
  # https://github.com/brunoorsolon/gluetun-qbt-watchdog
  gluetun-qbt-watchdog:
    image: ghcr.io/brunoorsolon/gluetun-qbt-watchdog:latest
    container_name: gluetun-qbt-watchdog
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    # Pas de healthcheck natif : en mode password le script réécrit /tmp/qbt_login_response.txt
    # à chaque cycle (30s) → on en vérifie la fraîcheur (< 5 min) pour détecter une boucle figée.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test $(( $(date +%s) - $(stat -c %Y /tmp/qbt_login_response.txt 2>/dev/null || echo 0) )) -lt 300",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - gluetun
      - qbittorrent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - GLUETUN_CONTAINER_NAME=gluetun
      - GLUETUN_API=http://gluetun:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - QBT_CONTAINER_NAME=qbittorrent
      # qBittorrent tourne dans le netns de gluetun → joignable via gluetun:8080
      - QBT_API=http://gluetun:8080
      - QBT_AUTH_MODE=password
      - QBT_USER=${QBT_USER}
      - QBT_PASS=${QBT_PASS}
      - CHECK_INTERVAL=60
    networks:
      - traefik_net
    profiles:
      - media
      - all

  # qui - WebUI qBittorrent (https://github.com/autobrr/qui)
  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      pocket-id:
        condition: service_healthy
      gluetun:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:7476/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # QUI__OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET fournis par Terraform
    # (cf. terraform/pocketid/generated/qui.env)
    env_file:
      - ./terraform/pocketid/generated/qui.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - QUI__HOST=0.0.0.0
      - QUI__PORT=7476
      - QUI__OIDC_ENABLED=true
      - QUI__OIDC_REDIRECT_URL=https://qui.lan.${DOMAIN_BASE}/api/auth/oidc/callback
      - QUI__OIDC_DISABLE_BUILT_IN_LOGIN=true
    volumes:
      - qui_config:/config
      # Mêmes chemins que qBittorrent (orphan scan, hardlinks, automations)
      - ${MEDIA_PATH}:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qui.rule=Host(`qui.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.qui.entrypoints=websecure"
      - "traefik.http.services.qui.loadbalancer.server.port=7476"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet), OIDC géré par qui ; /proxy/<clé> authentifié par clé client
    profiles:
      - media
      - all

  # Prowlarr - Indexer Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: "on-failure:2"
    mem_limit: 384m
    memswap_limit: 384m
    depends_on:
      tinyauth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PROWLARR__AUTH__METHOD=External
    volumes:
      - prowlarr_config:/config
    networks:
      - traefik_net
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Tinyauth conservé en défense-en-profondeur, CrowdSec retiré
      - "traefik.http.routers.prowlarr.middlewares=tinyauth@docker"
      # API hors Tinyauth (auth par clé X-Api-Key) pour clients natifs type Helmarr (via tailnet)
      - "traefik.http.routers.prowlarr-api.rule=Host(`prowlarr.lan.${DOMAIN_BASE}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.prowlarr-api.entrypoints=websecure"
      - "traefik.http.routers.prowlarr-api.service=prowlarr"
      - "traefik.http.routers.prowlarr-api.priority=100"
    profiles:
      - media
      - all

  # Tracearr - Activité Jellyfin (Jellyfin natif sur l'hôte : host.docker.internal:8096 dans l'UI)
  tracearr-db:
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1
    container_name: tracearr-db
    restart: "on-failure:2"
    mem_limit: 768m
    memswap_limit: 768m
    shm_size: 256mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.license=timescale -c timescaledb.max_tuples_decompressed_per_dml_transaction=100000 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off -c max_connections=150
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${TRACEARR_DB_PASSWORD:?tracearr database password required}
      - POSTGRES_DB=tracearr
      - TZ=${TZ}
    volumes:
      - tracearr_db_data:/home/postgres/pgdata/data
    networks:
      - traefik_net
    labels:
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^pg18\.\d+-ts\d+\.\d+\.\d+$$'
    profiles:
      - media
      - all

  tracearr-redis:
    image: redis:8-alpine
    container_name: tracearr-redis
    restart: "on-failure:2"
    mem_limit: 128m
    memswap_limit: 128m
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - tracearr_redis_data:/data
    networks:
      - traefik_net
    labels:
      - 'wud.tag.include=^8-alpine$$'
      - "wud.watch.digest=true"
    profiles:
      - media
      - all

  tracearr:
    image: ghcr.io/connorgallopo/tracearr:latest
    container_name: tracearr
    restart: "on-failure:2"
    mem_limit: 1g
    memswap_limit: 1g
    # OIDC_ISSUER_URL / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET fournis par Terraform
    # (cf. terraform/pocketid/generated/tracearr.env)
    env_file:
      - ./terraform/pocketid/generated/tracearr.env
    depends_on:
      pocket-id:
        condition: service_healthy
      tracearr-db:
        condition: service_healthy
      tracearr-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TZ=${TZ}
      - DATABASE_URL=postgres://tracearr:${TRACEARR_DB_PASSWORD:?tracearr database password required}@tracearr-db:5432/tracearr
      - REDIS_URL=redis://tracearr-redis:6379
      - JWT_SECRET=${TRACEARR_JWT_SECRET:?tracearr JWT secret required}
      - COOKIE_SECRET=${TRACEARR_COOKIE_SECRET:?tracearr cookie secret required}
      - TRUST_PROXY=true
      - OIDC_PROVIDER_NAME=Pocket ID
    volumes:
      - tracearr_backups:/data/backup
      - tracearr_images:/data/tracearr/image-cache
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracearr.rule=Host(`tracearr.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.tracearr.entrypoints=websecure"
      - "traefik.http.services.tracearr.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : Tinyauth en défense-en-profondeur
      - "traefik.http.routers.tracearr.middlewares=tinyauth@docker"
    profiles:
      - media
      - all

  # FreshRSS - RSS Feed Reader
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      pocket-id:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f apache2 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET fournis par Terraform
    # (cf. terraform/pocketid/generated/freshrss.env)
    env_file:
      - ./terraform/pocketid/generated/freshrss.env
    environment:
      - TZ=${TZ}
      - CRON_MIN=1,31
      # OIDC Configuration avec Pocket ID
      - OIDC_ENABLED=1
      - OIDC_PROVIDER_METADATA_URL=https://id.${DOMAIN_BASE}/.well-known/openid-configuration
      - OIDC_X_FORWARDED_HEADERS=X-Forwarded-Proto X-Forwarded-Host
      - OIDC_SCOPES=openid email profile
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`rss.${DOMAIN_BASE}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_net"
      # Public : CrowdSec (OIDC géré directement par FreshRSS)
      - "traefik.http.routers.freshrss.middlewares=crowdsec-bouncer@file"
    profiles:
      - tools
      - all

  # iSponsorBlockTV
  isponsorblocktv:
    image: ghcr.io/dmunozv04/isponsorblocktv:v2
    container_name: isponsorblocktv
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      - TZ=${TZ}
    volumes:
      - ./isponsorblocktv:/app/data
    networks:
      - traefik_net
    labels:
      - 'wud.tag.include=^v2$$'
      - "wud.watch.digest=true"
    profiles:
      - media
      - all

  # OpenClaw - Assistant IA (WhatsApp, navigateur headless, modèle LM Studio natif)
  # Isolé : réseau dédié partagé avec Traefik seul, pas de docker.sock ni de bind hôte
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest-browser
    container_name: openclaw
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    shm_size: 512m
    depends_on:
      tinyauth:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    environment:
      - TZ=${TZ}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_STATE_DIR=/home/node/.openclaw
    volumes:
      - openclaw_state:/home/node/.openclaw
    extra_hosts:
      # LM Studio natif (http://host.docker.internal:1234/v1)
      - "host.docker.internal:host-gateway"
    networks:
      - openclaw_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`openclaw.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.openclaw.entrypoints=websecure"
      - "traefik.http.services.openclaw.loadbalancer.server.port=18789"
      - "traefik.docker.network=openclaw_net"
      # Privé (tailnet) + Tinyauth, puis token du gateway
      - "traefik.http.routers.openclaw.middlewares=tinyauth@docker"
      # MAJ manuelles (openclaw doctor --fix après chaque version)
      - "wud.trigger.exclude=docker.update"
    profiles:
      - ai
      - all

  # Pocket ID - Fournisseur OIDC (passkeys), seule base d'utilisateurs/groupes.
  # Clients et groupes gérés par terraform/pocketid.
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless
    container_name: pocket-id
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      - TZ=${TZ}
      - APP_URL=https://id.${DOMAIN_BASE}
      - TRUST_PROXY=true
      - ANALYTICS_DISABLED=true
      - ENCRYPTION_KEY=${POCKETID_ENCRYPTION_KEY:?pocket-id encryption key required}
    volumes:
      - pocketid_data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`id.${DOMAIN_BASE}`)"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.pocketid.middlewares=crowdsec-bouncer@file"
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^v\d+\.\d+\.\d+-distroless$$'
    profiles:
      - infrastructure
      - devtools
      - all

  # Tinyauth - Forward auth Traefik, login délégué à Pocket ID (pas d'utilisateurs locaux).
  # Règles d'accès par variables TINYAUTH_APPS_* (pas de docker socket). Une app sans
  # règle est ouverte à tout compte autorisé par le client "tinyauth" de Pocket ID.
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
    container_name: tinyauth
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      pocket-id:
        condition: service_healthy
    # TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID / _CLIENTSECRET fournis par Terraform
    # (cf. terraform/pocketid/generated/tinyauth.env)
    env_file:
      - ./terraform/pocketid/generated/tinyauth.env
    environment:
      - TZ=${TZ}
      # Cookie posé sur le parent de l'APPURL (.lan.<domaine>) : session partagée entre *.lan
      - TINYAUTH_APPURL=https://tinyauth.lan.${DOMAIN_BASE}
      - TINYAUTH_AUTH_SESSIONEXPIRY=3600
      - TINYAUTH_AUTH_TRUSTEDPROXIES=192.168.97.0/24
      - TINYAUTH_OAUTH_AUTOREDIRECT=pocketid
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME=Pocket ID
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL=https://id.${DOMAIN_BASE}/authorize
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL=https://id.${DOMAIN_BASE}/api/oidc/token
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL=https://id.${DOMAIN_BASE}/api/oidc/userinfo
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL=https://tinyauth.lan.${DOMAIN_BASE}/api/oauth/callback/pocketid
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES=openid email profile groups
      - TINYAUTH_APPS_RADARR_CONFIG_DOMAIN=radarr.lan.${DOMAIN_BASE}
      - TINYAUTH_APPS_RADARR_OAUTH_GROUPS=radarr-access
      - TINYAUTH_APPS_SONARR_CONFIG_DOMAIN=sonarr.lan.${DOMAIN_BASE}
      - TINYAUTH_APPS_SONARR_OAUTH_GROUPS=sonarr-access
      - TINYAUTH_APPS_PROWLARR_CONFIG_DOMAIN=prowlarr.lan.${DOMAIN_BASE}
      - TINYAUTH_APPS_PROWLARR_OAUTH_GROUPS=prowlarr-access
      - TINYAUTH_APPS_TRACEARR_CONFIG_DOMAIN=tracearr.lan.${DOMAIN_BASE}
      - TINYAUTH_APPS_TRACEARR_OAUTH_GROUPS=tracearr-access
      - TINYAUTH_APPS_GLANCES_CONFIG_DOMAIN=glances.lan.${DOMAIN_BASE}
      - TINYAUTH_APPS_GLANCES_OAUTH_GROUPS=glances-access
      - TINYAUTH_APPS_OPENCLAW_CONFIG_DOMAIN=openclaw.lan.${DOMAIN_BASE}
      - TINYAUTH_APPS_OPENCLAW_OAUTH_GROUPS=openclaw-access
    volumes:
      - tinyauth_data:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tinyauth.rule=Host(`tinyauth.lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.tinyauth.entrypoints=websecure"
      - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    profiles:
      - infrastructure
      - devtools
      - all

  # Homepage - Dashboard léger
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: "on-failure:2"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      pocket-id:
        condition: service_healthy
    networks:
      - traefik_net
    extra_hosts:
      # Widget Glances : Glances tourne nativement sur l'hôte (port 61208)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./homepage-settings/services.yaml:/app/config/services.yaml
      - ./homepage-settings/settings.yaml:/app/config/settings.yaml
      - ./homepage-settings/widgets.yaml:/app/config/widgets.yaml
      - ./homepage-settings/docker.yaml:/app/config/docker.yaml
      - homepage_config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_PATH}:/mnt/media:ro
    # HOMEPAGE_OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET fournis par Terraform
    # (cf. terraform/pocketid/generated/homepage.env)
    env_file:
      - ./terraform/pocketid/generated/homepage.env
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=lan.${DOMAIN_BASE}
      # Domaine public (liens jellyfin/seerr/auth) et zone privée tailnet (le reste)
      - HOMEPAGE_VAR_DOMAIN=${DOMAIN_BASE}
      - HOMEPAGE_VAR_PRIVATE_DOMAIN=lan.${DOMAIN_BASE}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      # Widget CrowdSec : machine LAPI dédiée (cscli machines add homepage)
      - HOMEPAGE_VAR_CROWDSEC_USERNAME=${CROWDSEC_HOMEPAGE_USERNAME}
      - HOMEPAGE_VAR_CROWDSEC_PASSWORD=${CROWDSEC_HOMEPAGE_PASSWORD}
      # Widget qui : qBittorrent interrogé directement (netns gluetun)
      - HOMEPAGE_VAR_QBT_USER=${QBT_USER}
      - HOMEPAGE_VAR_QBT_PASSWORD=${QBT_PASS}
      # Widget WUD : compte local read-only "homepage" (l'API refuse l'anonyme)
      - HOMEPAGE_VAR_WUD_PASSWORD=${WUD_HOMEPAGE_PASSWORD:?wud homepage password required}
      # Auth native OIDC (Homepage >= 2.0) : remplace le forward auth Traefik.
      # AUTO_LOGIN garde la redirection transparente vers Pocket ID qu'offrait le proxy.
      - HOMEPAGE_AUTH_ENABLED=true
      - HOMEPAGE_AUTH_SECRET=${HOMEPAGE_AUTH_SECRET:?homepage auth secret required}
      - HOMEPAGE_EXTERNAL_URL=https://lan.${DOMAIN_BASE}
      - HOMEPAGE_OIDC_NAME=Pocket ID
      - HOMEPAGE_OIDC_AUTO_LOGIN=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`lan.${DOMAIN_BASE}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_net"
      # Privé (tailnet) : pas de forward auth ici, Homepage porte son propre OIDC
      # (les callbacks /api/auth/* doivent atteindre Homepage sans interception).
    profiles:
      - dashboard
      - infrastructure
      - all

  # SonarQube - Analyse de code
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: on-failure
    mem_limit: 2560m
    memswap_limit: 2560m
    depends_on:
      sonarqube-db:
        condition: service_healthy
    healthcheck:
      # L'image sonarqube:community n'embarque pas wget, seulement curl
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9000/api/system/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_POSTGRES_DB:-sonarqube}
      - SONAR_JDBC_USERNAME=${SONARQUBE_POSTGRES_USER:-sonarqube}
      - SONAR_JDBC_PASSWORD=${SONARQUBE_POSTGRES_PASSWORD:?sonarqube database password required}
      # Limites mémoire JVM (Xms doit être égal à Xmx pour Elasticsearch)
      - SONAR_WEB_JAVAOPTS=-Xmx512m -Xms512m
      - SONAR_CE_JAVAOPTS=-Xmx512m -Xms512m
      - SONAR_SEARCH_JAVAOPTS=-Xmx512m -Xms512m
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.${DOMAIN_BASE}`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
      - "traefik.docker.network=traefik_net"
      # Public : CrowdSec, login local SonarQube
      - "traefik.http.routers.sonarqube.middlewares=crowdsec-bouncer@file"
    profiles:
      - devtools
      - all

  # SonarQube PostgreSQL Database
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    restart: "on-failure:2"
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SONARQUBE_POSTGRES_USER:-sonarqube} -d ${SONARQUBE_POSTGRES_DB:-sonarqube}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - POSTGRES_USER=${SONARQUBE_POSTGRES_USER:-sonarqube}
      - POSTGRES_PASSWORD=${SONARQUBE_POSTGRES_PASSWORD:?sonarqube database password required}
      - POSTGRES_DB=${SONARQUBE_POSTGRES_DB:-sonarqube}
      - TZ=${TZ}
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - traefik_net
    labels:
      - "wud.trigger.exclude=docker.update"
      - 'wud.tag.include=^16-alpine$$'
      - "wud.watch.digest=true"
    profiles:
      - devtools
      - all

  # CrowdSec - Security Engine (IPS collaboratif)
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/linux crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      - GID=${PGID}
      # Enroll key pour la console CrowdSec
      - ENROLL_KEY=${CROWDSEC_ENROLL_KEY}
      - ENROLL_INSTANCE_NAME=${HOSTNAME:-docker-server}
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      # Configuration d'acquisition personnalisée
      - ./crowdsec-acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      # Logs Traefik à analyser
      - traefik_logs:/var/log/traefik:ro
      # Logs SSH (host)
      - /var/log/auth.log:/var/log/auth.log:ro
      # Docker socket pour lire les logs des conteneurs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=false"
      - "wud.trigger.exclude=docker.update"
    networks:
      - traefik_net
    profiles:
      - security
      - infrastructure
      - all

networks:
  traefik_net:
    name: traefik_net
    external: true
  openclaw_net:
    name: openclaw_net
    ipam:
      config:
        - subnet: 172.30.50.0/24

volumes:
  # Traefik
  traefik_letsencrypt:
  traefik_config:
  traefik_logs:

  # Tailscale (état du nœud dah-proxy — doit persister pour garder l'identité)
  dah_proxy_state:

  # Homepage
  homepage_config:

  # Arcane
  arcane_data:

  # WUD
  wud_store:

  # Seerr
  seerr_config:

  # Radarr
  radarr_config:

  # Sonarr
  sonarr_config:

  # qBittorrent
  qbittorrent_config:

  # qui
  qui_config:

  # Prowlarr
  prowlarr_config:

  # Pocket ID / Tinyauth
  pocketid_data:
  tinyauth_data:

  # SonarQube
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgres_data:

  # CrowdSec
  crowdsec_config:
  crowdsec_data:

  # FreshRSS
  freshrss_data:
  freshrss_extensions:

  # Tracearr
  tracearr_db_data:
  tracearr_redis_data:
  tracearr_backups:
  tracearr_images:

  # OpenClaw (config, identifiants WhatsApp, workspace, profil navigateur)
  openclaw_state:
